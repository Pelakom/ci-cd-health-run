name: CI/CD Runner Health Report
on:
  workflow_dispatch:
  schedule:
    - cron: '34 * * * *'
permissions:
  contents: read
concurrency:
  group: server-health
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Read enabled targets without credentials
        id: targets
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work alpine:3.23 \
            sh -ec 'apk add --no-cache python3 py3-yaml; python3 scripts/workflow.py plan > matrix.out'
          cat matrix.out >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: health-plan
          path: plan.json
          retention-days: 7
          if-no-files-found: error

  health:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: matrix.id >= 0
        with:
          persist-credentials: false
      - name: Build Alpine collector before loading credentials
        if: matrix.id >= 0
        run: docker build -f .github/Dockerfile.health -t health-collector .github
      - name: Collect one target with its selected credentials
        if: matrix.id >= 0
        env:
          TARGET_INDEX: ${{ matrix.id }}
          HEALTH_REFERENCES_JSON: ${{ toJSON(matrix.references) }}
          HEALTH_PRIVATEKEY: ${{ matrix.references.privatekey.source == 'secret' && secrets[matrix.references.privatekey.name] || matrix.references.privatekey.source == 'var' && vars[matrix.references.privatekey.name] || '' }}
          HEALTH_PASSWORD: ${{ matrix.references.password.source == 'secret' && secrets[matrix.references.password.name] || matrix.references.password.source == 'var' && vars[matrix.references.password.name] || '' }}
          HEALTH_KNOWN_HOSTS: ${{ matrix.references.known_hosts.source == 'secret' && secrets[matrix.references.known_hosts.name] || matrix.references.known_hosts.source == 'var' && vars[matrix.references.known_hosts.name] || '' }}
          HEALTH_GITHUB_TOKEN: ${{ matrix.references.github_token.source == 'secret' && secrets[matrix.references.github_token.name] || matrix.references.github_token.source == 'var' && vars[matrix.references.github_token.name] || '' }}
        run: |
          mkdir -p reports
          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$GITHUB_WORKSPACE/reports:/reports" \
            -e HEALTH_REFERENCES_JSON -e HEALTH_PRIVATEKEY -e HEALTH_PASSWORD \
            -e HEALTH_KNOWN_HOSTS -e HEALTH_GITHUB_TOKEN \
            health-collector python3 scripts/health.py --target-index "$TARGET_INDEX" --output /reports
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: ${{ always() && matrix.id >= 0 }}
        with:
          name: target-${{ matrix.id }}
          path: reports/health.json
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [plan, health]
    if: ${{ always() && needs.plan.result == 'success' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
      - name: Combine reports without target credentials
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work alpine:3.23 \
            sh -ec 'apk add --no-cache python3 py3-yaml; python3 scripts/workflow.py merge --plan artifacts/health-plan/plan.json'
          cat reports/health.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish release report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="health-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" reports/health.md reports/health.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Server health $tag" --notes-file reports/health.md --latest=false
      - name: Mark unhealthy run
        run: |
          python3 -c 'import json,sys; r=json.load(open("reports/health.json")); sys.exit(1 if r["failed"] else 0)'
