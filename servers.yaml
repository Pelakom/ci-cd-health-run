# Nilai kredensial adalah referensi, bukan isi secret.
# Aktifkan target setelah mengisi host/nama dan repository secrets.
command: sh -s
probe: scripts/health.sh
timeout_seconds: 180
servers:
  ssh:
    server1:
      enabled: false
      user: root
      host: remote-host
      port: 22
      privatekey: secret:SSH_SERVER1_KEY
      known_hosts: secret:SSH_SERVER1_KNOWN_HOSTS
    server2:
      enabled: false
      user: root
      host: remote-host-2
      password: secret:SSH_SERVER2_PASSWORD
      known_hosts: secret:SSH_SERVER2_KNOWN_HOSTS
  github-codespace:
    account1:
      github_token: secret:CODESPACES_ACCOUNT1_TOKEN
      codespace1:
        enabled: true
        name: curly-space-train-767qr77vg562pvv9
      codespace2:
        enabled: true
        name: ubiquitous-space-garbanzo-x7r69rr5jv936745
    account2:
      github_token: secret:CODESPACES_ACCOUNT2_TOKEN
      codespace1:
        enabled: true
        name: scaling-journey-97576xj4px7rc7rqx
      codespace2:
        enabled: true
        name: stunning-spoon-97576xj4pwwjcx599
